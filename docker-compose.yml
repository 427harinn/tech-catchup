services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tech-catchup-backend
    command: ["node", "--watch", "src/server.js"]
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/app.db}
      NOTION_API_KEY: ${NOTION_API_KEY:-}
      NOTION_DATABASE_ID: ${NOTION_DATABASE_ID:-}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
    container_name: tech-catchup-frontend
    environment:
      VITE_API_PROXY_TARGET: ${VITE_API_PROXY_TARGET:-http://backend:3000}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    restart: unless-stopped
